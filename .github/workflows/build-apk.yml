name: Gerar APK Android

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Gerar APK a partir do PWA
        uses: pwa-builder/pwa-action@v1
        with:
          manifest_url: 'https://evanirezende21-hue.github.io/Teste/manifest.json'
          output_dir: 'dist'

      - name: Salvar APK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: moto-taxi-sjn-apk
          path: dist/*
