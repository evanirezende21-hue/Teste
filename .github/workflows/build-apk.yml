name: Gerar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar APK com Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          npx @bubblewrap/cli init --manifest=https://evanirezende21-hue.github.io/Teste/manifest.json --directory=android-app --signingKeyPath=""
          cd android-app
          npx @bubblewrap/cli build

      - name: Salvar APK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: moto-taxi-sjn-apk
          path: android-app/*.apk
