name: Gerar APK Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão do App'
        required: false
        default: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Criar APK Direto via PWA
        uses: pwa-builder/pwa-action@v1
        with:
          manifest_url: 'https://evanirezende21-hue.github.io/Teste/manifest.json'
          output_dir: 'apk-output'

      - name: Salvar APK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: moto-taxi-sjn-apk
          path: apk-output/
