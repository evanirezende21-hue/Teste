name: Gerar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar e Gerar Projeto Android
        run: |
          npm install -g @bubblewrap/cli
          npx @bubblewrap/cli init --manifest=https://evanirezende21-hue.github.io/Teste/manifest.json --directory=android-app --signingKeyPath="" --signingKeyAlias=""
          cd android-app
          chmod +x gradlew || true
          ./gradlew assembleDebug

      - name: Salvar APK Gerado
        uses: actions/upload-artifact@v4
        with:
          name: moto-taxi-sjn-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
