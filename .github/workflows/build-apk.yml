name: Gerar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gerar Projeto Android PWA
        uses: pwa-builder/pwa-action@v1.0.1
        with:
          manifest_url: 'https://evanirezende21-hue.github.io/Teste/manifest.json'

      - name: Dar Permissão ao Gradle
        run: |
          cd pwa-builder-android || true
          chmod +x gradlew || true

      - name: Compilar APK Debug com Gradle
        run: |
          cd pwa-builder-android || true
          ./gradlew assembleDebug

      - name: Salvar APK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: moto-taxi-sjn-apk
          path: |
            pwa-builder-android/app/build/outputs/apk/debug/*.apk
            pwa-builder-android/*.apk
            *.apk
