name: Gerar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Gerar APK via PWABuilder CLI
        run: |
          npm install -g @pwabuilder/cli
          pwabuilder package --manifest https://evanirezende21-hue.github.io/Teste/manifest.json --platforms android --directory output-apk

      - name: Salvar APK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: moto-taxi-sjn-apk
          path: output-apk/
