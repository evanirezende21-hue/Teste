name: Gerar APK Moto Táxi SJN

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar PWA CLI e Gerar Projeto
        run: |
          npm install -g @bubblewrap/cli
          yes | bubblewrap init --manifest=https://evanirezende21-hue.github.io/Teste/manifest.json --directory=android-app --skip-integrity-validation || true

      - name: Compilar APK com Gradle
        run: |
          if [ -d "android-app" ]; then
            cd android-app
            chmod +x gradlew || true
            ./gradlew assembleDebug
          else
            echo "Erro ao gerar pasta Android" && exit 1
          fi

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: moto-taxi-sjn-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
