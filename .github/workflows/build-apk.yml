name: Gerar APK Android

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Aceitar Licenças Android
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Instalar Bubblewrap e Compilar APK
        run: |
          npm install -g @bubblewrap/cli
          npx @bubblewrap/cli init --manifest=https://evanirezende21-hue.github.io/Teste/manifest.json --directory=android-app
          cd android-app
          npx @bubblewrap/cli build

      - name: Salvar APK Gerado
        uses: actions/upload-artifact@v4
        with:
          name: moto-taxi-sjn-apk
          path: android-app/*.apk
