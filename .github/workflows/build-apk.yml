name: Gerar APK Android

on:
  push:
    branches:
      - main  # ou 'master', dependendo do nome da sua branch principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Instalar Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Gerar Projeto Android e Compilar APK
        run: |
          npx @bubblewrap/cli init --manifest=https://${{ github.actor }}.github.io/${{ github.event.repository.name }}/manifest.json --directory=android-project
          cd android-project
          npx @bubblewrap/cli build

      - name: Salvar APK como Artefato
        uses: actions/upload-artifact@v3
        with:
          name: moto-taxi-sjn-apk
          path: android-project/app-release-signed.apk
